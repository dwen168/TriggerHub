name: Manual Wyckoff Outcome Shadow Research

on:
  workflow_dispatch:
    inputs:
      run_training:
        description: "Train Wyckoff outcome v1 shadow research artifact against DATABASE_URL"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: wyckoff-outcome-shadow-research
  cancel-in-progress: false

jobs:
  outcome-shadow-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v6
        with:
          repository: 'dwen168/asxscreener101'
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: 'private-repo'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'private-repo/requirements.txt'

      - name: Install dependencies
        run: |
          cd private-repo
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Wyckoff ML tests
        run: |
          cd private-repo
          python -m unittest tests_py.test_ml_walk_forward

      - name: Train Wyckoff outcome v1 shadow model
        if: inputs.run_training
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd private-repo
          python -m algo_src.ml.wyckoff.pipeline.outcome_v1

      - name: Commit and push updated shadow artifact
        if: inputs.run_training
        run: |
          cd private-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain algo_src/ml/wyckoff/)" ]; then
            git add algo_src/ml/wyckoff/
            git commit -m "chore(ml): update Wyckoff outcome v1 shadow artifact [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No changes in shadow ML artifact."
          fi
