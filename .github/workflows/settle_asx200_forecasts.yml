name: ASX 200 Daily Forecast Settlement

on:
  workflow_dispatch:
  schedule:
    - cron: '20 17 * * 1-5'
      timezone: 'Australia/Sydney'

permissions:
  contents: write

concurrency:
  group: asx200-daily-forecast-settlement
  cancel-in-progress: false

jobs:
  settle-asx200-forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v6
        with:
          repository: 'dwen168/asxscreener101'
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: 'private-repo'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'private-repo/requirements.txt'

      - name: Install dependencies
        run: |
          cd private-repo
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Settle forecast history without replacing the UI outlook
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd private-repo
          python -m algo_src.ml.asx200hybrid.serving.publish_prediction --settlement-only

      - name: Commit settled forecast history
        run: |
          cd private-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/asx200_prediction_history.json public/asx200_prediction_live_evaluation.json)" ]; then
            git add public/asx200_prediction_history.json public/asx200_prediction_live_evaluation.json
            git commit -m "chore(ml): settle ASX 200 forecast history [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No ASX 200 forecast settlement changes."
          fi
