name: Daily ASX and A-share Market Update

on:
  schedule:
    # 两个市场均收盘后只执行一次，避免盘前和盘中重复全量读写数据库。
    - cron: '10 18 * * 1-5'
      timezone: 'Australia/Sydney'
  workflow_dispatch: # 支持在 GitHub Web UI 上手动点击触发运行

permissions:
  contents: write # 必须赋予写权限才能将更新后的数据 push 回仓库

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v6
        with:
          repository: 'dwen168/asxscreener101'
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: 'private-repo'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip' # 缓存 pip 依赖加速构建
          cache-dependency-path: 'private-repo/requirements.txt'

      - name: Install dependencies
        run: |
          cd private-repo
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Analysis Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ASXSCREENER_ALGO_VERSION: v2.0.0-d595ea3eb1b9-d1fc40605a24
          RUN_HEAVY_ANALYSIS: 'true'
        run: |
          cd private-repo
          python algo_src/analysis_engine.py
          python algo_src/analysis_engine.py --ashare
          python algo_src/public_artifacts.py public

      - name: Commit and push changes
        run: |
          cd private-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 检查 public/ 目录下文件是否有变动，避免没有变动时 commit 报错
          if [ -n "$(git status --porcelain public/)" ]; then
            git add public/
            git commit -m "chore: auto-update real-time market and backtest data [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No changes in market data."
          fi
