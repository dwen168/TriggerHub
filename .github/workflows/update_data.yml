name: Daily ASX and A-share Market Update

on:
  schedule:
    - cron: '10 18 * * 1-5'
      timezone: 'Australia/Sydney'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v6
        with:
          repository: 'dwen168/asxscreener101'
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: 'private-repo'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'private-repo/requirements.txt'

      - name: Install dependencies
        working-directory: private-repo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ASX Analysis
        working-directory: private-repo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ASXSCREENER_ALGO_VERSION: v2.0.0-d595ea3eb1b9-d1fc40605a24
          RUN_HEAVY_ANALYSIS: 'true'
          PYTHONUNBUFFERED: '1'
        run: python algo_src/analysis_engine.py

      - name: Run A-share Analysis
        working-directory: private-repo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ASXSCREENER_ALGO_VERSION: v2.0.0-d595ea3eb1b9-d1fc40605a24
          RUN_HEAVY_ANALYSIS: 'true'
          PYTHONUNBUFFERED: '1'
        run: python algo_src/analysis_engine.py --ashare

      - name: Compact public artifacts
        working-directory: private-repo
        env:
          PYTHONUNBUFFERED: '1'
        run: python algo_src/public_artifacts.py public

      - name: Commit and push changes
        working-directory: private-repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain public/)" ]; then
            git add public/
            git commit -m "chore: auto-update real-time market and backtest data [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No changes in market data."
          fi
