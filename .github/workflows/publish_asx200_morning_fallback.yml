name: ASX 200 Morning Daily Fallback

on:
  workflow_dispatch:
  schedule:
    - cron: '38 8 * * 1-5'
      timezone: 'Australia/Sydney'

permissions:
  contents: write

concurrency:
  group: asx200-morning-fallback
  cancel-in-progress: false

jobs:
  publish-morning-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v6
        with:
          repository: 'dwen168/asxscreener101'
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: 'private-repo'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'private-repo/requirements.txt'

      - name: Install dependencies
        run: |
          cd private-repo
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ASX 200 contract tests
        run: |
          cd private-repo
          python -m unittest tests_py.test_asx200_hybrid

      - name: Hold the runner until US market data is complete
        run: |
          cd private-repo
          python -m algo_src.ml.asx200hybrid.serving.wait_for_near_close --hour 9 --minute 43

      - name: Fetch and verify the completed US close snapshot
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          cd private-repo
          timeout 60s python -m algo_src.ml.asx200hybrid.ingestion.ingest_factors --period 1mo --allow-partial --require-us-close --retry-until 09:44 --retry-seconds 15 &
          factor_ingest_pid=$!
          timeout 60s python -m algo_src.ml.asx200hybrid.ingestion.ingest_macro &
          macro_ingest_pid=$!
          wait "$factor_ingest_pid" || true
          wait "$macro_ingest_pid" || true

      - name: Run frozen daily inference
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd private-repo
          python -m algo_src.ml.asx200hybrid.serving.predict --artifact algo_src/ml/asx200hybrid/artifacts/asx200_hybrid_model.json

      - name: Publish the morning daily baseline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd private-repo
          python -m algo_src.ml.asx200hybrid.serving.publish_prediction --daily-only

      - name: Commit the 09:45 UI fallback
        run: |
          cd private-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/asx200_prediction.json public/asx200_prediction_history.json public/asx200_prediction_live_evaluation.json)" ]; then
            git add public/asx200_prediction.json public/asx200_prediction_history.json public/asx200_prediction_live_evaluation.json
            git commit -m "chore(ml): publish ASX 200 morning fallback [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No morning ASX 200 fallback changes."
          fi
