name: Update TP4 Wyckoff Joint Replay

on:
  workflow_dispatch:
    inputs:
      market:
        description: Market to replay
        required: true
        default: both
        type: choice
        options:
          - both
          - asx
          - ashare

permissions:
  contents: write

concurrency:
  group: update-tp4-wyckoff-joint-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: 'dwen168/asxscreener101'
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: 'private-repo'
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'private-repo/requirements.txt'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'private-repo/package-lock.json'

      - name: Install dependencies
        run: |
          cd private-repo
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      - name: Verify joint replay contracts
        run: |
          cd private-repo
          npm test
          python -m unittest tests_py.test_tp4_wyckoff_joint_export

      - name: Export and replay ASX production candidates
        if: inputs.market == 'both' || inputs.market == 'asx'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TP4_WYCKOFF_JOINT_EXPORT_PATH: /tmp/tp4_wyckoff_asx_candidates.json
        run: |
          cd private-repo
          python algo_src/strategy_replay_backtest.py
          npm run replay:tp4-wyckoff -- --market ASX --candidates /tmp/tp4_wyckoff_asx_candidates.json --persist-registry

      - name: Export and replay A-share production candidates
        if: inputs.market == 'both' || inputs.market == 'ashare'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TP4_WYCKOFF_JOINT_EXPORT_PATH: /tmp/tp4_wyckoff_ashare_candidates.json
        run: |
          cd private-repo
          python algo_src/strategy_replay_backtest.py --ashare
          npm run replay:tp4-wyckoff -- --market ASHARE --candidates /tmp/tp4_wyckoff_ashare_candidates.json --persist-registry

      - name: Commit immutable joint evidence
        run: |
          cd private-repo
          if [ -z "$(git status --porcelain -- public/backtest_tp4_wyckoff_joint_versions.json 'public/backtest_tp4_wyckoff_joint_*.json')" ]; then
            echo "TP4 × Wyckoff joint evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/backtest_tp4_wyckoff_joint_versions.json 'public/backtest_tp4_wyckoff_joint_*.json'
          git commit -m "data: publish TP4 Wyckoff joint replay"
          git pull --rebase --autostash origin main
          git push origin main
